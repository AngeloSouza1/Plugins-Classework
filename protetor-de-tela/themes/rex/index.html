<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rex dormindo</title>
  <style>
    /* Base do tema: a cena ocupa a tela inteira. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: linear-gradient(#bfe8ff, #dff1fb); }
    svg { display: block; width: 100%; height: 100%; }
    svg > rect { rx: 0; } /* sem cantos arredondados no céu e na noite */
    body::before { /* noite também na faixa de céu fora do desenho */
      content: ""; position: fixed; inset: 0; z-index: -1; background: #102347; opacity: 0;
      animation: anoitecer 8s ease-in-out 24s forwards;
    }

    /* Animações originais do desenho (Rex-SVG). */
    .nuvem {
      animation: moverNuvem 18s linear infinite, escurecerElemento 8s ease-in-out 24s forwards;
    }

    .nuvem.lenta {
      animation-duration: 24s;
    }

    .arvore-noite {
      animation: escurecerElemento 8s ease-in-out 24s forwards;
    }

    .passaro {
      animation: atravessarCeu 24s linear infinite, sumirAoAnoitecer 4s ease-in-out 24s forwards;
    }

    .passaro.atraso {
      animation-delay: -12s;
    }

    .asa {
      transform-box: fill-box;
      transform-origin: center;
    }

    .asa.esquerda {
      animation: baterAsaEsquerda 0.9s ease-in-out infinite;
    }

    .asa.direita {
      animation: baterAsaDireita 0.9s ease-in-out infinite;
    }

    .zz {
      animation: subirZ 4.2s ease-in-out infinite;
      transform-origin: center;
      fill: #ffffff;
    }

    .zz.z2 {
      animation-delay: 0.8s;
    }

    .zz.z3 {
      animation-delay: 1.6s;
    }

    .cachorro-cabeca {
      animation: respirarSono 3.2s ease-in-out infinite;
      transform-origin: center;
    }

    .orelha {
      transform-box: fill-box;
      transform-origin: center;
    }

    .orelha.esquerda {
      animation: mexerOrelhaEsquerda 3.2s ease-in-out infinite;
    }

    .orelha.direita {
      animation: mexerOrelhaDireita 3.2s ease-in-out infinite;
    }

    .noite-overlay {
      opacity: 0;
      animation: anoitecer 8s ease-in-out 24s forwards;
      pointer-events: none;
    }

    .estrelas {
      opacity: 0;
      animation: surgirEstrelas 8s ease-in-out 24s forwards;
      pointer-events: none;
    }

    .estrela-pisca {
      animation: surgirEstrelas 8s ease-in-out 24s forwards, piscarEstrela 1.4s ease-in-out 32s infinite;
    }

    .estrela-pisca.lenta {
      animation: surgirEstrelas 8s ease-in-out 24s forwards, piscarEstrela 2s ease-in-out 33s infinite;
    }

    .lua {
      opacity: 0;
      animation: aparecerLua 10s ease-in-out 34s forwards;
      pointer-events: none;
    }

    @keyframes moverNuvem {
      0% {
        transform: translateX(-30px);
      }
      50% {
        transform: translateX(30px);
      }
      100% {
        transform: translateX(-30px);
      }
    }

    @keyframes atravessarCeu {
      0% {
        transform: translateX(540px) translateY(6px) scale(1);
      }
      20% {
        transform: translateX(330px) translateY(-6px) scale(1.03);
      }
      40% {
        transform: translateX(120px) translateY(-14px) scale(1.05);
      }
      60% {
        transform: translateX(-90px) translateY(-4px) scale(1.02);
      }
      80% {
        transform: translateX(-340px) translateY(-12px) scale(1.04);
      }
      100% {
        transform: translateX(-660px) translateY(8px) scale(1);
      }
    }

    @keyframes baterAsaEsquerda {
      0%, 100% {
        transform: rotate(10deg) scaleX(1);
      }
      50% {
        transform: rotate(-14deg) scaleX(1.04);
      }
    }

    @keyframes baterAsaDireita {
      0%, 100% {
        transform: rotate(-10deg) scaleX(1);
      }
      50% {
        transform: rotate(14deg) scaleX(1.04);
      }
    }

    @keyframes subirZ {
      0% {
        opacity: 0;
        transform: translateX(-10px) translateY(18px) scale(0.72);
      }
      30% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateX(12px) translateY(-28px) scale(1.08);
      }
    }

    @keyframes respirarSono {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(4px);
      }
    }

    @keyframes mexerOrelhaEsquerda {
      0%, 100% {
        transform: rotate(0deg) translateY(0);
      }
      50% {
        transform: rotate(-6deg) translateY(1px);
      }
    }

    @keyframes mexerOrelhaDireita {
      0%, 100% {
        transform: rotate(0deg) translateY(0);
      }
      50% {
        transform: rotate(6deg) translateY(1px);
      }
    }

    @keyframes anoitecer {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 0.52;
      }
    }

    @keyframes surgirEstrelas {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes escurecerElemento {
      0% {
        filter: brightness(1);
      }
      100% {
        filter: brightness(0.72);
      }
    }

    @keyframes sumirAoAnoitecer {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes piscarEstrela {
      0%, 100% {
        opacity: 1;
        filter: drop-shadow(0 0 0px #ffe066);
      }
      50% {
        opacity: 0.55;
        filter: drop-shadow(0 0 6px #ffe066);
      }
    }

    @keyframes aparecerLua {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
  </style>

  <script>
    (function () {
      var svg = document.querySelector("svg");

      // Telas largas: a cena cobre tudo (corta um pouco as bordas).
      // Telas estreitas (celular em pé): mostra a cena inteira, encostada embaixo.
      function fit() {
        var ratio = window.innerWidth / window.innerHeight;
        var wide = ratio >= 1.2;
        svg.setAttribute("preserveAspectRatio", wide ? "xMidYMid slice" : "xMidYMax meet");
        // Em tela estreita o desenho encosta embaixo; o céu acima dele usa a mesma cor do topo do desenho.
        var drawH = window.innerWidth * 0.62;
        document.body.style.background = wide ? "" :
          "linear-gradient(#bfe8ff 0px, #dff1fb " + Math.max(0, window.innerHeight - drawH) + "px)";
      }
      window.addEventListener("resize", fit);
      fit();

      ScreensaverTheme.init({ autoWake: true });
    })();
  </script>
